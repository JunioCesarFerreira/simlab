# Response headers applied to every route.
#
# Included at server level only. nginx's add_header does NOT inherit into a
# location that declares its own add_header, so no location in
# conf.d/simlab.conf may add headers of its own - use proxy_hide_header there
# instead.

# HSTS. Shorten or comment this out while testing against `localhost` with a
# self-signed certificate: browsers pin per hostname, and a one-year pin on
# `localhost` forces HTTPS on every other project you run locally.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff"                      always;
add_header X-Frame-Options        "SAMEORIGIN"                   always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# No Content-Security-Policy on purpose: the Vue build and Grafana both need
# inline styles/eval, and a wrong policy fails silently in the browser. Add one
# per-route only after checking the console.
