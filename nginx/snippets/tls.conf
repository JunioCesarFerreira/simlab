# TLS termination settings, shared by every HTTPS server block.
#
# The certificate pair is created on first start by the `proxy-certs` init
# container (self-signed). To use a real certificate, drop the PEM files in
# nginx/certs/ under these exact names and restart the proxy.
ssl_certificate     /etc/nginx/certs/simlab.crt;
ssl_certificate_key /etc/nginx/certs/simlab.key;

# Mozilla "intermediate" profile: no TLS 1.0/1.1, forward secrecy only.
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:SimLabTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
