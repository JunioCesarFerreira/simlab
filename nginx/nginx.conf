# SimLab reverse proxy - main nginx configuration.
#
# This is the only ingress into the stack: the SPA, the REST API (Swagger
# included) and Grafana no longer publish ports on the host, so every request
# from outside arrives here over TLS.
#
# Route map lives in conf.d/simlab.conf.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Keep the nginx version out of responses and error pages.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Source/firmware uploads (POST /api/v1/sources) and experiment ZIP
    # downloads pass through here; the 1m default rejects them.
    client_max_body_size 100m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Grafana Live upgrades to websockets; the other upstreams never send
    # an Upgrade header, so this maps to "close" for them.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP -> HTTPS redirect server. Rendered from /etc/nginx/templates at
    # container start (see the proxy service in docker-compose.yaml) so the
    # redirect can carry a non-default published HTTPS port.
    include /etc/nginx/generated/*.conf;

    include /etc/nginx/conf.d/*.conf;
}
