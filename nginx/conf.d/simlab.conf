# SimLab route map - the single HTTPS entry point.
#
#   https://<host>/               -> gui:80        Vue SPA
#   https://<host>/api/v1/...     -> restapi:8000  REST API
#   https://<host>/docs           -> restapi:8000  Swagger UI
#   https://<host>/redoc          -> restapi:8000  ReDoc
#   https://<host>/openapi.json   -> restapi:8000  OpenAPI schema
#   https://<host>/grafana/       -> grafana:3000  dashboards
#
# Plain HTTP on :80 only answers /healthz and redirects everything else; that
# server block is generated from ../templates/00-http-redirect.conf.template.

server {
    # IPv4 only, matching gui/simlab/nginx.conf: the compose networks are not
    # created with IPv6, and binding [::] fails outright when the address
    # family is unavailable.
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Emit relative Location headers. An absolute redirect would be rebuilt
    # from the *container* port (443) and break any deployment that publishes
    # HTTPS on a different host port.
    absolute_redirect off;

    # Docker's embedded DNS, re-resolved every 10s. Combined with the
    # $upstream variables below this keeps the proxy working after a backend
    # container is recreated with a new IP - a literal name in proxy_pass is
    # resolved once at startup and then goes stale.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $upstream_gui      http://gui:80;
    set $upstream_api      http://restapi:8000;
    set $upstream_grafana  http://grafana:3000;

    # Proxy liveness. Answered locally, never forwarded.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- REST API ---------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass $upstream_api$request_uri;
    }

    # --- Swagger UI / ReDoc / OpenAPI schema ------------------------------
    # Also covers /docs/oauth2-redirect, which FastAPI serves under /docs/.
    location ~ ^/(docs|redoc|openapi\.json) {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass $upstream_api$request_uri;
    }

    # --- Grafana ----------------------------------------------------------
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        include /etc/nginx/snippets/proxy-common.conf;

        # Grafana Live (dashboard streaming) upgrades to a websocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Grafana runs with GF_SERVER_SERVE_FROM_SUB_PATH=true, so it expects
        # the /grafana prefix intact - do not strip it here.
        proxy_pass $upstream_grafana$request_uri;

        # Grafana sends its own X-Frame-Options: deny. Drop it so clients do
        # not receive two conflicting values alongside the server-level header.
        proxy_hide_header X-Frame-Options;
    }

    # --- Vue SPA ----------------------------------------------------------
    # The gui container runs its own nginx with try_files, so deep links are
    # resolved there.
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass $upstream_gui$request_uri;
    }
}
