services:

  # ---------------------------------------------------------------------------
  # Ingress. Nothing else in the stack publishes an HTTP port any more: the SPA,
  # the REST API (Swagger included) and Grafana are reachable only through this
  # proxy, over TLS. Route map: nginx/README.md.
  # ---------------------------------------------------------------------------

  # One-shot init: writes a self-signed certificate into nginx/certs/ and exits.
  # It skips itself once simlab.crt/simlab.key exist, so installing a real
  # certificate is just a matter of dropping the PEM files in that directory.
  proxy-certs:
    image: alpine/openssl:3.5.4
    container_name: simlab_proxy_certs
    entrypoint: ["/bin/sh", "/scripts/generate-self-signed.sh"]
    environment:
      - SIMLAB_TLS_CN=${SIMLAB_TLS_CN:-localhost}
      - SIMLAB_TLS_SAN=${SIMLAB_TLS_SAN:-DNS:localhost,IP:127.0.0.1}
      - SIMLAB_TLS_DAYS=${SIMLAB_TLS_DAYS:-825}
    volumes:
      - ./nginx/scripts:/scripts:ro
      - ./nginx/certs:/certs
    labels:
      - "simlab.type=init"
      - "simlab.role=tls"
      - "simlab.group=proxy"

  proxy:
    image: nginx:1.27-alpine
    container_name: simlab_proxy
    restart: unless-stopped
    ports:
      - "${SIMLAB_HTTP_PORT:-80}:80"
      - "${SIMLAB_HTTPS_PORT:-443}:443"
    environment:
      # Target of the HTTP -> HTTPS redirect. Must carry the port when HTTPS is
      # published somewhere other than 443 (e.g. https://simlab.example.org:8443).
      - SIMLAB_PUBLIC_URL=${SIMLAB_PUBLIC_URL:-https://localhost}
      # Render nginx/templates/*.template into /etc/nginx/generated, expanding
      # only ${SIMLAB_*} so nginx's own $$variables survive envsubst.
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/generated
      - NGINX_ENVSUBST_FILTER=^SIMLAB_
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # The image entrypoint refuses to render templates unless the output
    # directory exists and is writable; every other path here is read-only.
    tmpfs:
      - /etc/nginx/generated
    labels:
      - "simlab.type=proxy"
      - "simlab.role=ingress"
      - "simlab.group=proxy"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      gui:
        condition: service_healthy
      restapi:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - proxy-net

  # Pinned tags (not :latest) so the monitoring stack behaves identically on a
  # developer machine and on the production VM.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - --docker=unix:///var/run/docker.sock
      - --store_container_labels=true
    ports:
      # Loopback only: the UI is a local debugging aid, Prometheus scrapes it
      # over monitoring-net.
      - "127.0.0.1:8080:8080"
    labels:
      - "simlab.type=collector"
      - "simlab.role=metrics"
      - "simlab.group=monitoring"
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Loopback only. docs/markdown/RUNTIME_METRICS.md relies on reaching the
      # expression browser at http://localhost:9090 from the host.
      - "127.0.0.1:9090:9090"
    labels:
      - "simlab.type=timeseries"
      - "simlab.role=storage"
      - "simlab.group=monitoring"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      - cadvisor
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    # No published port: dashboards are reachable only through the reverse
    # proxy at https://<host>/grafana/.
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-simlab}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-simlab123}
      # Served under the proxy's /grafana/ sub-path. root_url has to match the
      # URL the browser uses, port included, or Grafana's own asset and login
      # redirects point outside the proxy.
      - GF_SERVER_ROOT_URL=${SIMLAB_PUBLIC_URL:-https://localhost}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # TLS terminates at the proxy, so the session cookie can be secure-only.
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
    restart: unless-stopped
    labels:
      - "simlab.type=visualization"
      - "simlab.role=dashboard"
      - "simlab.group=monitoring"
    healthcheck:
      # serve_from_sub_path moves every route, /api/health included, under
      # /grafana.
      test: ["CMD", "curl", "-f", "http://localhost:3000/grafana/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - prometheus
    networks:
      - monitoring-net
      - proxy-net

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      # Loopback only - this mongod runs without authentication. Containers
      # reach it over mongo-net; host tools go through an SSH tunnel.
      - "127.0.0.1:27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "simlab.type=database"
      - "simlab.role=storage"
      - "simlab.group=infrastructure"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      retries: 30
    volumes:
      - "mongo_data:/data/db"
      - "mongo_config:/data/configdb"
    networks:
      - mongo-net

  restapi:
    build:
      context: .
      dockerfile: Dockerfile.rest-api
    container_name: rest_api
    restart: always
    working_dir: /app
    environment:
      - PYTHONPATH=/app:/app/pylib
      - DB_NAME=simlab
      - SIMLAB_API_KEY=${SIMLAB_API_KEY:-simlab-api-key42}
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0
      - IS_DOCKER=True
      # Manual runtime-metrics retry (POST /experiments/{id}/runtime-metrics/collect)
      # queries Prometheus directly from the API, so it must reach the monitoring
      # network. Keep in sync with the moengine PROMETHEUS_URL.
      - PROMETHEUS_URL=http://prometheus:9090
    # No published port: the API, Swagger included, is reachable only through
    # the reverse proxy at https://<host>/api/v1/ and https://<host>/docs.
    labels:
      - "simlab.type=api"
      - "simlab.role=orchestrator"
      - "simlab.group=backend"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mongo-net
      - proxy-net
      - monitoring-net

  gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_API_KEY: ${SIMLAB_API_KEY:-simlab-api-key42}
    container_name: simlab_gui
    restart: unless-stopped
    # No published port: the SPA is served through the reverse proxy at
    # https://<host>/.
    labels:
      - "simlab.type=frontend"
      - "simlab.role=ui"
      - "simlab.group=frontend"
    depends_on:
      restapi:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (not localhost): nginx.conf only has "listen 80" (IPv4), and
      # the image entrypoint skips its IPv6 patch on a custom default.conf.
      # BusyBox wget tries ::1 first and does not fall back.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy-net

  moengine:
    build:
      context: .
      dockerfile: Dockerfile.mo-engine
    container_name: mo_engine
    restart: unless-stopped
    working_dir: /app
    environment:
      - PYTHONPATH=/app:/app/pylib
      - DB_NAME=simlab
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0
      - TEMPLATE_XML=/app/mo-engine/simulation_template.xml
      - IS_DOCKER=True
      # Runtime telemetry: Prometheus is queried over [start_time, end_time]
      # when each experiment finishes; raw series go to GridFS, summary to the
      # experiment document.
      - PROMETHEUS_URL=http://prometheus:9090
      # TELEMETRY_ENABLED=True                 → set False to disable
      # TELEMETRY_QUERY_STEP=15s               → query_range resolution
      # TELEMETRY_COLLECTION_DELAY_SECONDS=30  → wait for the final scrape
      # TELEMETRY_BACKFILL_HOURS=6             → sweep window (recent runs only)
      # TELEMETRY_SWEEP_INTERVAL_SECONDS=600   → periodic backfill cadence (0 = startup only)
      # TELEMETRY_STALE_CLAIM_SECONDS=900      → release 'collecting' claims older than this
    ports:
      # Loopback only: SSH into the container is a debugging entry point.
      - "127.0.0.1:2219:22"
    labels:
      - "simlab.type=engine"
      - "simlab.role=processor"
      - "simlab.group=backend"
    healthcheck:
      # pgrep is unavailable: python:3.12-slim ships without procps.
      # PID 1 is the app process, so inspect its cmdline directly.
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'python' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
      # Wait for Prometheus so the startup backfill sweep doesn't run before the
      # monitoring stack is reachable (it would otherwise mark runs 'unavailable'
      # until the next sweep tick).
      prometheus:
        condition: service_healthy
    networks:
      - mongo-net
      - monitoring-net

  masternode:
    build:
      context: .
      dockerfile: Dockerfile.master-node
    container_name: master_node
    restart: unless-stopped
    working_dir: /app
    environment:
      - PYTHONPATH=/app:/app/pylib
      - DB_NAME=simlab
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0
      - IS_DOCKER=True
      - NUMBER_OF_CONTAINERS=16
      - COOJA_JVM_XMS=4g
      - COOJA_JVM_XMX=4g
      # Synthetic benchmark mode (global fallback — prefer per-experiment config via GUI)
      # ENABLE_DATA_SYNTHETIC=True  → bypass Cooja and evaluate BENCH analytically
      # BENCH=DTLZ2                 → benchmark function: DTLZ2 | ZDT1 | SCH1
      # NOISE_STD=0.0               → Gaussian noise std added to benchmark output
      #- ENABLE_DATA_SYNTHETIC=False
      #- BENCH=DTLZ2
      #- NOISE_STD=0.0
    ports:
      # Loopback only: SSH into the container is a debugging entry point.
      - "127.0.0.1:2220:22"
    labels:
      - "simlab.type=master"
      - "simlab.role=controller"
      - "simlab.group=backend"
    healthcheck:
      # pgrep is unavailable: python:3.12-slim ships without procps.
      # PID 1 is the app process, so inspect its cmdline directly.
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'python' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mongo-net
      - cooja-net


# Attention! When modifying the number of Cooja containers, 
